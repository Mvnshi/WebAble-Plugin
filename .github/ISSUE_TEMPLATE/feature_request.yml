name: "💡 Feature request"
description: Suggest an improvement that isn't a brand-new tool.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need?
      description: What are you (or your users) trying to do that's hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like WebAble to do? Config option, API, behavior change…
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which part?
      options:
        - Embeddable widget
        - Browser extension
        - Engine / both
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
