name: Release

# Push a tag like v3.0.0 to publish a GitHub release with the extension ZIP
# (the Chrome Web Store upload, and the easiest download for everyone else).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: The tag matches the manifest version
        run: |
          manifest=$(node -p "require('./apps/extension/manifest.json').version")
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest."
            exit 1
          fi

      - name: Build and package
        run: |
          npm run package:extension
          cd dist && zip -qr "../webable-widget-${GITHUB_REF_NAME}.zip" widget.js webable.js webable

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/extension/store/webable-extension-${GITHUB_REF_NAME}.zip \
            webable-widget-${GITHUB_REF_NAME}.zip \
            --title "WebAble ${GITHUB_REF_NAME}" \
            --notes "Download webable-extension-${GITHUB_REF_NAME}.zip, unzip it, open chrome://extensions, switch on Developer mode, and choose Load unpacked on the unzipped folder. See CHANGELOG.md for what changed."
