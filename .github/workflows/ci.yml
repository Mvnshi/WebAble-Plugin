name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for the real-browser tests
        run: npx playwright install --with-deps chromium

      # Types, unit tests, real-browser tests, widget budget, axe audit, house style.
      - name: npm run check
        run: npm run check

      # extension/ is what people download and load unpacked, and dist/ is what
      # the jsDelivr snippet serves. Both are built output that is committed, so
      # a source change without a rebuild would ship stale code to everyone.
      - name: Built output matches the source
        run: |
          npm run build
          if ! git diff --exit-code --stat -- extension dist; then
            echo "::error::extension/ or dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
