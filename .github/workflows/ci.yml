name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check (engine, runtime, bundle)
        run: npm run check

      - name: Engine smoke test
        run: npm run smoke

      - name: Build the widget
        run: npm run build

      - name: dist/ is in sync with source
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
