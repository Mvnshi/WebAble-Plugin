<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebAble fixture: framed child</title>
<style>
  body { font: 15px/1.5 Georgia, serif; margin: 0; padding: 12px; background: #fff; color: #222; }
</style>
</head>
<body>
  <h2 id="heading">Inside the frame</h2>
  <p id="copy">
    Whatever the page around this is doing, this document gets the same
    treatment: the same larger text, the same spacing, the same focus ring.
  </p>
  <!-- A 2x2 red PNG. Media has to survive an inverting filter here the same
       way it does in the top document. -->
  <img id="pic" width="40" height="40" alt="A red square"
       src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFklEQVR42mP8z8BQz0AEYBxVSF+FAP5FDvcfRYWgAAAAAElFTkSuQmCC">
</body>
</html>
